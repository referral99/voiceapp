{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block page_title %}Legal{% endblock %} — SpeakFluent</title>
    <meta name="description" content="{% block page_desc %}SpeakFluent legal and policy information.{% endblock %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'chat/css/style.css' %}">
    <style>
        /* ---------- Legal / policy pages (matches site theme) ---------- */
        .legal-wrap {
            width: 100%;
            max-width: 820px;
            margin: 0 auto 40px;
        }
        .legal-card {
            background: rgba(255, 255, 255, 0.97);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 24px;
            box-shadow: var(--shadow-lg);
            padding: 44px 46px;
        }
        .legal-card h1 {
            font-size: 2em;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin: 0 0 6px;
            color: var(--slate, #1f2937);
        }
        .legal-updated { color: var(--muted, #64748b); font-size: 0.9em; margin: 0 0 26px; }
        .legal-card h2 {
            font-size: 1.2em;
            font-weight: 700;
            margin: 28px 0 10px;
            color: var(--primary-dark, #3730a3);
        }
        .legal-card p,
        .legal-card li {
            color: #374151;
            line-height: 1.7;
            font-size: 0.98em;
        }
        .legal-card ul { padding-left: 20px; margin: 10px 0; }
        .legal-card li { margin: 6px 0; }
        .legal-card a { color: var(--primary, #4f46e5); font-weight: 600; }
        .legal-card .contact-block {
            background: #f8fafc;
            border: 1px solid var(--border, #e2e8f0);
            border-radius: 14px;
            padding: 18px 22px;
            margin: 16px 0;
            line-height: 1.9;
        }
        .legal-note {
            background: #fffbeb;
            border: 1px solid #fde68a;
            border-radius: 12px;
            padding: 12px 16px;
            color: #92400e;
            font-size: 0.88em;
            margin: 18px 0;
        }
    </style>
</head>
<body>
<div class="hero-bg">

    <!-- Top navigation -->
    <nav class="topbar">
        <div class="brand">
            <span class="logo-mark">🗣️</span>
            <span>SpeakFluent</span>
        </div>
        <div class="wallet-info">
            <a href="{% url 'home' %}" class="btn-premium" style="background:rgba(255,255,255,0.18);color:#fff;box-shadow:none;border:1px solid rgba(255,255,255,0.3);">← Back to Home</a>
        </div>
    </nav>

    <main class="legal-wrap">
        <div class="legal-card">
            <h1>{% block heading %}{% endblock %}</h1>
            <p class="legal-updated">Last updated: {% now "F j, Y" %}</p>
            {% block content %}{% endblock %}
        </div>
    </main>

    {% include "chat/_policy_footer.html" %}

</div>
</body>
</html>
